name: Slow tests

on:
  schedule:
    - cron: "0 3 * * 1" # mondays at 03:00 UTC
  workflow_dispatch:

jobs:
  slow-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache Hugging Face models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          # keyed on the files that name the models
          key: huggingface-${{ hashFiles('anonipy/anonymize/generators/*_label_generator.py', 'anonipy/anonymize/extractors/ner_extractor.py', 'test/test_*.py') }}
          restore-keys: |
            huggingface-
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Test with real models
        run: pytest -m "slow or integration"
