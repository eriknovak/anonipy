[build-system]
requires = ['setuptools>=42']
build-backend = 'setuptools.build_meta'

[project]
name = "anonipy"
description = "The data anonymization package"
authors=[
    { name = "Erik Novak" },
    { name = "Nina Kokalj" }
]
maintainers = [{ name = "Erik Novak" }]
readme = "README.md"
license = { file = "LICENSE" }
dynamic = ["version"]
dependencies = [
    # NLP and LLMs
    "spacy>=3.8.14",
    "gliner>=0.2.26",
    "transformers>=4.51.3,<5.7.0",
    "sentencepiece>=0.2.1",
    "protobuf>=7.34.1",
    "accelerate>=1.13.0",
    "lingua-language-detector>=2.1.1",
    "python-dateutil>=2.9.0",
    "babel>=2.18.0",
    "dateparser>=1.4.0",
    # File readers
    "pypdf>=6.11.0",
    "python-docx>=1.2.0",
    # Monitoring
    "tqdm>=4.67.3",
]
keywords = ["python", "machine learning", "natural language processing", "anonymization"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"

[project.urls]
Source = "https://github.com/eriknovak/anonipy"
Docs = "https://eriknovak.github.io/anonipy"

[project.optional-dependencies]
dev = [
    "ruff==0.17.3",
    "python-githooks",
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-minify-plugin",
]
test = [
    "pytest",
    "pytest-cov",
]
quant = [
    "bitsandbytes",
]
all = ["anonipy[dev,test,quant]"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
]
ignore = [
    "E501", # line length is owned by the formatter
    "B905", # zip(strict=...) would change runtime behaviour
]

[tool.ruff.format]
# doc snippets are wrapped by hand for the narrow docs page
exclude = ["*.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["anonipy*"]

[tool.setuptools.dynamic]
version = { attr = "anonipy.__version__" }

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--verbose --strict-markers --tb=short -m 'not slow and not integration'"
markers = [
    "slow: loads real models; skipped by default (run with '-m \"slow or integration\"')",
    "integration: runs several components on real models; skipped by default",
]
filterwarnings = [
    "ignore:builtin type SwigPy.*:DeprecationWarning",
    "ignore:builtin type swigvarlink.*:DeprecationWarning",
    "ignore:`torch.jit.script` is deprecated:DeprecationWarning",
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
    "ignore:The `resume_download` argument is deprecated:UserWarning",
]